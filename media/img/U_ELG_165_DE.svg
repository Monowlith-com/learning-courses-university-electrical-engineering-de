<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Messmittel und Prüfsicherheit</title><desc>Eigenes schematisches Lehrmodell; keine Auslegungs- oder Prüfanleitung.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial,sans-serif" fill="#20242b"><text x="45" y="55" font-size="27" font-weight="bold">Messmittel und Prüfsicherheit</text><path d="M45 85H915" stroke="#cbd5e1"/><path d="M160 250H300M500 250H730V310M730 390V440H160V365M160 275V250M160 275V290M160 350V365" stroke="#24649c" stroke-width="3" fill="none"/><circle cx="160" cy="320" r="35" fill="#fff" stroke="#24649c" stroke-width="3"/><text x="160" y="330" text-anchor="middle" font-size="22">V₀</text><rect x="300" y="230" width="200" height="40" fill="#dce9f5" stroke="#24649c" stroke-width="2"/><text x="400" y="218" text-anchor="middle" font-size="23">Innenwiderstand Rₛ</text><text x="400" y="302" text-anchor="middle" font-size="22">100 kΩ</text><rect x="700" y="310" width="60" height="80" fill="#e9c5a6" stroke="#24649c" stroke-width="2"/><text x="620" y="350" text-anchor="middle" font-size="22">1 MΩ</text><text x="160" y="390" text-anchor="middle" font-size="22">5 V</text><text x="730" y="290" text-anchor="middle" font-size="22">Messgerät Rₘ</text><text x="730" y="480" text-anchor="middle" font-size="23">Anzeige Vₘ: 4,545 V</text><text x="160" y="200" text-anchor="middle" font-size="22">Leerlauf V₀</text><text x="480" y="565" text-anchor="middle" font-size="18">Eigenes schematisches Lehrmodell; keine Auslegungs- oder Prüfanleitung.</text></g></svg>